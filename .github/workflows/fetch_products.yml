name: fetch-shop-product-photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch_products.yml", "brand/products_urls.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p brand/products
          while read -r n u; do
            curl -fsSL -A "Mozilla/5.0" -o "brand/products/$n.jpg" "$u" || echo "FAIL $n"
          done < brand/products_urls.txt
          ls -la brand/products
      - run: |
          git config user.name "stationhq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add brand/products
          git diff --cached --quiet || git commit -m "Shop product photos for ads"
          git pull -q --rebase origin main
          git push origin HEAD:main
