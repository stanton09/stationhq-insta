name: fetch-shop-product-photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch_products.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p brand/products
          for s in chief-mug captain-mug lieutenant-mug probie-mug firefighter-mug engineer-mug engine-company-trucker ladder-company-trucker rescue-company-trucker shq-firehouse-badge-beanie helmet-axes-trucker-hat firehouse-hoodie engine-company-hoodie first-in-last-out-hoodie answer-the-call-hoodie the-irons-hoodie; do
            curl -fsSL -A "Mozilla/5.0" "https://shop.stationhq.app/products/$s" -o /tmp/p.html || continue
            sed 's#\\u002F#/#g; s#\\/#/#g; s/&amp;/\&/g' /tmp/p.html > /tmp/q.html
            echo "$s: $(grep -c imgproxy /tmp/q.html) lines with imgproxy"
            grep -oE 'https://imgproxy\.fourthwall\.dev/[A-Za-z0-9_-]+/w:1920/[^"'"'"' ,)\\]+\.jpg' /tmp/q.html | awk '!seen[$0]++' | head -3 > /tmp/u.txt
            [ -s /tmp/u.txt ] || grep -oE 'https://imgproxy\.fourthwall\.dev/[A-Za-z0-9_-]+/w:[0-9]+/[^"'"'"' ,)\\]+\.(jpg|png)' /tmp/q.html | awk '!seen[$0]++' | head -3 > /tmp/u.txt
            wc -l < /tmp/u.txt
            i=0
            while read -r u; do
              i=$((i+1))
              curl -fsSL -A "Mozilla/5.0" -o "brand/products/${s}_$i.jpg" "$u" || true
            done < /tmp/u.txt
          done
          ls -la brand/products
      - run: |
          git config user.name "stationhq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add brand/products
          git diff --cached --quiet || git commit -m "Shop product photos for ads"
          git pull -q --rebase origin main
          git push origin HEAD:main
