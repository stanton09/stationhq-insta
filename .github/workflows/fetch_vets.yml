name: fetch-vets-media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch_vets.yml", "scripts/fetch_commons.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 fetch_commons.py
      - run: |
          git config user.name "stationhq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/vets
          git diff --cached --quiet || git commit -m "Veterans Day source media (public domain, Wikimedia Commons)"
          git pull -q --rebase origin main
          git push origin HEAD:main
