name: tiktok-nist-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/tiktok_nist.yml", "scripts/tiktok_nist.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
      - name: build clips
        run: cd scripts && python tiktok_nist.py
      - name: commit
        run: |
          git config user.name "stationhq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/tiktok/nist
          git diff --cached --quiet || git commit -m "TikTok NIST clips"
          git pull -q --rebase origin main
          git push origin HEAD:main
