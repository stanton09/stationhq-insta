name: Instagram autopost

on:
  schedule:
    # Times are UTC. Eastern Standard Time = UTC-5 (shift one hour earlier in summer if you like).
    # OFF to save Make credits: - cron: "37 12 * * *"  # 7:37 AM ET - daily repost picks
    - cron: "7 14 * * *"   # 9:07 AM ET  - StationHQ post
    - cron: "7 15 * * *"   # 10:07 AM ET - retry (skips if already posted today)
    - cron: "7 16 * * 0-5" # 11:07 AM ET - retry (Sat 11:07 is NIST)
    - cron: "7 17 * * *"   # 12:07 PM ET - retry + DVIDS live-burn Reel (collab repost if none found)
    - cron: "7 21 * * *"   # 4:07 PM ET  - live-fire collab repost
    - cron: "7 23 * * 0-5" # Sun-Fri 6:07 PM ET - fire-safety post if one is due (M/W/F), else collab repost
    - cron: "37 0 * * 1-6" # Sun-Fri 7:37 PM ET - evening retry (UTC is already the next day)
    - cron: "37 15 * * *"  # 10:37 AM ET - Story-only repost
    - cron: "37 18 * * *"  # 1:37 PM ET - Story-only repost (also NIST retry on Sat)
    - cron: "37 22 * * *"  # 5:37 PM ET - Story-only repost
    - cron: "37 1 * * *"   # 8:37 PM ET - Story-only repost
    - cron: "17 7 * * *"   # 2:17 AM ET - refill the clip library if it's low (and every Sunday)
    - cron: "7 16 * * 6"   # Sat 11:07 AM ET - NIST fire-science Reel
    - cron: "37 18 * * 6"  # Sat 1:37 PM ET - NIST retry (skips if already posted)
    - cron: "7 23 * * 6"   # Sat 6:07 PM ET - weekly NJ Fire Jobs carousel
    - cron: "37 0 * * 0"   # Sat 7:37 PM ET - NJ Fire Jobs retry (skips if already posted)
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [own, repost, picks, scout, nist, dvids, capture, metasetup, graphtest, safetybuild, safety, safetypick, evening, jobs, report, comments, reply, story, refill, hype, restory, fetch]
        default: own
      dry_run:
        description: "Dry run (don't actually post)"
        type: boolean
        default: true
      test_account:
        description: "Optional: repost-lookup test against this handle only"
        type: string
        default: ""
      payload:
        description: "Optional: JSON for the reply job"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      MAKE_PUBLISH_URL: ${{ secrets.MAKE_PUBLISH_URL }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}   # unlocks the direct API (music + collab invites)
      MAKE_LOOKUP_URL: ${{ secrets.MAKE_LOOKUP_URL }}
      TEST_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 16 * * 6" ] || [ "${{ github.event.schedule }}" = "37 18 * * 6" ]; then
            echo "job=nist" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 23 * * 6" ] || [ "${{ github.event.schedule }}" = "37 0 * * 0" ]; then
            echo "job=jobs" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 15 * * *" ] || [ "${{ github.event.schedule }}" = "7 16 * * 0-5" ]; then
            echo "job=own" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 17 * * *" ]; then
            echo "job=own_then_dvids" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 23 * * 0-5" ] || [ "${{ github.event.schedule }}" = "37 0 * * 1-6" ]; then
            echo "job=evening" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 18 * * *" ] || [ "${{ github.event.schedule }}" = "37 1 * * *" ] || [ "${{ github.event.schedule }}" = "37 15 * * *" ] || [ "${{ github.event.schedule }}" = "37 22 * * *" ]; then
            echo "job=story" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 7 * * *" ]; then
            echo "job=refill" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 12 * * *" ]; then
            echo "job=picks" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 14 * * *" ]; then
            echo "job=own" >> "$GITHUB_OUTPUT"
          else
            echo "job=repost" >> "$GITHUB_OUTPUT"
          fi

      - name: Post StationHQ content
        if: steps.pick.outputs.job == 'own' || steps.pick.outputs.job == 'own_then_repost' || steps.pick.outputs.job == 'own_then_dvids'
        run: python scripts/post_own.py

      - name: Daily repost picks
        if: steps.pick.outputs.job == 'picks'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd scripts && python picks.py

      - name: Install Pillow
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'own_then_repost' || steps.pick.outputs.job == 'graphtest' || steps.pick.outputs.job == 'story' || steps.pick.outputs.job == 'own_then_dvids' || steps.pick.outputs.job == 'evening'
        run: pip install -q pillow

      - name: Install ffmpeg
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'own_then_repost' || steps.pick.outputs.job == 'scout' || steps.pick.outputs.job == 'nist' || steps.pick.outputs.job == 'dvids' || steps.pick.outputs.job == 'evening' || steps.pick.outputs.job == 'capture' || steps.pick.outputs.job == 'graphtest' || steps.pick.outputs.job == 'story' || steps.pick.outputs.job == 'refill' || steps.pick.outputs.job == 'own_then_dvids' || steps.pick.outputs.job == 'hype'
        timeout-minutes: 6
        run: |
          command -v ffmpeg && exit 0
          # static build from GitHub (apt mirrors sometimes hang for 30+ min)
          if curl -fsSL --retry 3 --max-time 180 -o /tmp/ff.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo /tmp/ff/bin >> "$GITHUB_PATH"
          else
            timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi

      - name: NIST fire-science Reel
        if: steps.pick.outputs.job == 'nist'
        env:
          NIST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
        run: cd scripts && python nist.py

      - name: Fire-safety post
        if: steps.pick.outputs.job == 'safety' || steps.pick.outputs.job == 'evening'
        run: pip install -q Pillow && cd scripts && python safety.py post

      - name: DVIDS live-fire Reel
        if: steps.pick.outputs.job == 'dvids' || steps.pick.outputs.job == 'own_then_dvids'
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
        run: cd scripts && python dvids.py

      - name: Meta API setup (one time)
        if: steps.pick.outputs.job == 'metasetup'
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/meta_setup.py

      - name: Direct API checks (read-only)
        if: steps.pick.outputs.job == 'graphtest'
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: cd scripts && python graph_probe.py

      - name: NJ Fire Jobs carousel
        if: steps.pick.outputs.job == 'jobs'
        run: pip install -q Pillow && cd scripts && python jobs.py post

      - name: Build fire-safety posts
        if: steps.pick.outputs.job == 'safetybuild'
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
        run: pip install -q Pillow && cd scripts && python safety.py build

      - name: Fire-safety photo options
        if: steps.pick.outputs.job == 'safetypick'
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
        run: pip install -q Pillow && cd scripts && python safety.py candidates

      - name: Hype edit of a StationHQ post
        if: steps.pick.outputs.job == 'hype'
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
        run: pip install -q Pillow && cd scripts && python hype.py ${{ inputs.test_account || '05_grouptexts' }}

      - name: Re-post a picture to the Story (fitted to 9:16)
        if: steps.pick.outputs.job == 'restory'
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          pip install -q Pillow
          cd scripts && python -c "import os, ig, graph; u = ig.story_ready(os.environ['PAYLOAD']); print('Story image:', u); print('Story posted:', graph.publish('STORIES', u, '') if not os.environ.get('DRY_RUN') else '[dry run]')"

      - name: Fetch a licensed music file (incompetech only) for local editing
        if: steps.pick.outputs.job == 'fetch'
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          case "$PAYLOAD" in https://incompetech.com/music/royalty-free/*) ;; *) echo "not allowed"; exit 1;; esac
          mkdir -p /tmp/fetched && curl -sSfL -o /tmp/fetched/track.mp3 "$PAYLOAD" && ls -la /tmp/fetched

      - name: Hand fetched file over on the scratch branch
        if: steps.pick.outputs.job == 'fetch'
        run: |
          cd /tmp/fetched && git init -q && git checkout -q -b scratch
          git config user.name "stationhq-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "scratch file" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scratch

      - name: Weekly growth report
        if: steps.pick.outputs.job == 'report'
        run: cd scripts && python report.py

      - name: List new comments
        if: steps.pick.outputs.job == 'comments'
        run: cd scripts && python comments.py list

      - name: Reply to comments
        if: steps.pick.outputs.job == 'reply'
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: cd scripts && python comments.py reply

      - name: Story-only repost
        if: steps.pick.outputs.job == 'story'
        run: cd scripts && python story.py

      - name: Refill the clip library
        if: steps.pick.outputs.job == 'refill'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd scripts && python refill.py

      - name: Store captured clips
        if: steps.pick.outputs.job == 'capture'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/capture.py

      - name: Scout for repost sources
        if: steps.pick.outputs.job == 'scout'
        run: cd scripts && python scout.py

      - name: Collab repost if this slot is still empty
        if: env.DRY_RUN == '' && (steps.pick.outputs.job == 'own_then_dvids' || steps.pick.outputs.job == 'evening')
        run: |
          n=$(python scripts/slots.py)
          need=1; [ "${{ steps.pick.outputs.job }}" = "evening" ] && need=3
          echo "Feed posts so far today: $n (this slot needs $need)"
          if [ "$n" -lt "$need" ]; then python scripts/repost.py; fi

      - name: Repost from a firehouse account
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'own_then_repost'
        env:
          PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || '' }}
        run: python scripts/repost.py

      - name: Save progress
        if: env.DRY_RUN == ''
        run: |
          git config user.name "stationhq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content state || true
          git diff --cached --quiet || git commit -m "autopost: ${{ steps.pick.outputs.job }} $(date -u +%F)"
          git pull -q --rebase origin main || true
          git push origin HEAD:main
