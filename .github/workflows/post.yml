name: Instagram autopost

on:
  schedule:
    # Times are UTC. Eastern Standard Time = UTC-5 (shift one hour earlier in summer if you like).
    - cron: "37 12 * * *"  # 7:37 AM ET  - daily repost picks (you tap Repost)
    - cron: "7 14 * * *"   # 9:07 AM ET  - StationHQ post
    - cron: "7 17 * * *"   # 12:07 PM ET - repost
    - cron: "7 21 * * *"   # 4:07 PM ET  - repost
    - cron: "7 1 * * *"    # 8:07 PM ET  - repost
    - cron: "7 16 * * 6"   # Sat 11:07 AM ET - NIST fire-science Reel
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [own, repost, picks, scout, nist]
        default: own
      dry_run:
        description: "Dry run (don't actually post)"
        type: boolean
        default: true
      test_account:
        description: "Optional: repost-lookup test against this handle only"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      MAKE_PUBLISH_URL: ${{ secrets.MAKE_PUBLISH_URL }}
      MAKE_LOOKUP_URL: ${{ secrets.MAKE_LOOKUP_URL }}
      TEST_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 16 * * 6" ]; then
            echo "job=nist" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 12 * * *" ]; then
            echo "job=picks" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 14 * * *" ]; then
            echo "job=own" >> "$GITHUB_OUTPUT"
          else
            echo "job=repost" >> "$GITHUB_OUTPUT"
          fi

      - name: Post StationHQ content
        if: steps.pick.outputs.job == 'own'
        run: python scripts/post_own.py

      - name: Daily repost picks
        if: steps.pick.outputs.job == 'picks'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd scripts && python picks.py

      - name: Install ffmpeg
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'scout' || steps.pick.outputs.job == 'nist'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: NIST fire-science Reel
        if: steps.pick.outputs.job == 'nist'
        env:
          NIST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
        run: cd scripts && python nist.py

      - name: Scout for repost sources
        if: steps.pick.outputs.job == 'scout'
        run: cd scripts && python scout.py

      - name: Repost from a firehouse account
        if: steps.pick.outputs.job == 'repost'
        run: python scripts/repost.py

      - name: Save progress
        if: env.DRY_RUN == ''
        run: |
          git config user.name "stationhq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content state || true
          git diff --cached --quiet || git commit -m "autopost: ${{ steps.pick.outputs.job }} $(date -u +%F)"
          git pull -q --rebase origin main || true
          git push origin HEAD:main
