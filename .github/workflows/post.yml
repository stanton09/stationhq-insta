name: Instagram autopost

on:
  schedule:
    # Times are UTC. Eastern Standard Time = UTC-5 (shift one hour earlier in summer if you like).
    # OFF to save Make credits: - cron: "37 12 * * *"  # 7:37 AM ET - daily repost picks
    - cron: "7 14 * * *"   # 9:07 AM ET  - StationHQ post
    - cron: "7 15 * * *"   # 10:07 AM ET - retry (skips if already posted today)
    - cron: "7 16 * * 0-5" # 11:07 AM ET - retry (Sat 11:07 is NIST)
    - cron: "7 17 * * *"   # 12:07 PM ET - retry + repost #1
    - cron: "7 21 * * *"   # 4:07 PM ET  - repost #2
    - cron: "7 23 * * 1,3,5" # Mon/Wed/Fri 6:07 PM ET - DVIDS live-fire Reel
    - cron: "37 0 * * 2,4,6" # Mon/Wed/Fri 7:37 PM ET - DVIDS retry (UTC is already the next day)
    - cron: "7 16 * * 6"   # Sat 11:07 AM ET - NIST fire-science Reel
    - cron: "37 18 * * 6"  # Sat 1:37 PM ET - NIST retry (skips if already posted)
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [own, repost, picks, scout, nist, dvids, capture, metasetup, graphtest]
        default: own
      dry_run:
        description: "Dry run (don't actually post)"
        type: boolean
        default: true
      test_account:
        description: "Optional: repost-lookup test against this handle only"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      MAKE_PUBLISH_URL: ${{ secrets.MAKE_PUBLISH_URL }}
      MAKE_LOOKUP_URL: ${{ secrets.MAKE_LOOKUP_URL }}
      TEST_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 16 * * 6" ] || [ "${{ github.event.schedule }}" = "37 18 * * 6" ]; then
            echo "job=nist" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 15 * * *" ] || [ "${{ github.event.schedule }}" = "7 16 * * 0-5" ]; then
            echo "job=own" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 17 * * *" ]; then
            echo "job=own_then_repost" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 23 * * 1,3,5" ] || [ "${{ github.event.schedule }}" = "37 0 * * 2,4,6" ]; then
            echo "job=dvids" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 12 * * *" ]; then
            echo "job=picks" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 14 * * *" ]; then
            echo "job=own" >> "$GITHUB_OUTPUT"
          else
            echo "job=repost" >> "$GITHUB_OUTPUT"
          fi

      - name: Post StationHQ content
        if: steps.pick.outputs.job == 'own' || steps.pick.outputs.job == 'own_then_repost'
        run: python scripts/post_own.py

      - name: Daily repost picks
        if: steps.pick.outputs.job == 'picks'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd scripts && python picks.py

      - name: Install Pillow
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'own_then_repost'
        run: pip install -q pillow

      - name: Install ffmpeg
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'own_then_repost' || steps.pick.outputs.job == 'scout' || steps.pick.outputs.job == 'nist' || steps.pick.outputs.job == 'dvids' || steps.pick.outputs.job == 'capture'
        timeout-minutes: 6
        run: |
          command -v ffmpeg && exit 0
          # static build from GitHub (apt mirrors sometimes hang for 30+ min)
          if curl -fsSL --retry 3 --max-time 180 -o /tmp/ff.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo /tmp/ff/bin >> "$GITHUB_PATH"
          else
            timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi

      - name: NIST fire-science Reel
        if: steps.pick.outputs.job == 'nist'
        env:
          NIST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
        run: cd scripts && python nist.py

      - name: DVIDS live-fire Reel
        if: steps.pick.outputs.job == 'dvids'
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.test_account || '' }}
        run: cd scripts && python dvids.py

      - name: Meta API setup (one time)
        if: steps.pick.outputs.job == 'metasetup'
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/meta_setup.py

      - name: Direct API checks (read-only)
        if: steps.pick.outputs.job == 'graphtest'
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: cd scripts && python graph_probe.py

      - name: Store captured clips
        if: steps.pick.outputs.job == 'capture'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/capture.py

      - name: Scout for repost sources
        if: steps.pick.outputs.job == 'scout'
        run: cd scripts && python scout.py

      - name: Repost from a firehouse account
        if: steps.pick.outputs.job == 'repost' || steps.pick.outputs.job == 'own_then_repost'
        run: python scripts/repost.py

      - name: Save progress
        if: env.DRY_RUN == ''
        run: |
          git config user.name "stationhq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content state || true
          git diff --cached --quiet || git commit -m "autopost: ${{ steps.pick.outputs.job }} $(date -u +%F)"
          git pull -q --rebase origin main || true
          git push origin HEAD:main
